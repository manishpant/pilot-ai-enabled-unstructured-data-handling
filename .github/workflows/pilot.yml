name: Pilot pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1:
    name: Stage 1 format detection
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Detect file types
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/s1_detect.py

  stage2:
    name: Stage 2 extract to JSON
    needs: stage1
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Extract text into JSON
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/s2_extract.py

      - name: Upload JSON records
        uses: actions/upload-artifact@v4
        with:
          name: extracted-json
          path: json/*.json
          if-no-files-found: error

  stage3:
    name: Stage 3 quality gate
    needs: stage2
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Remove previous JSON results
        run: rm -f json/*.json good/*.json bad/*.json

      - name: Download JSON records
        uses: actions/download-artifact@v4
        with:
          name: extracted-json
          path: json

      - name: Score and split good or bad
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/s3_quality.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pilot-results
          path: |
            json/
            good/
            bad/
            vector_db/
          if-no-files-found: error

      - name: Commit JSON files to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A json good bad
          if git diff --cached --quiet; then
            echo "No JSON changes to commit"
            exit 0
          fi
          git commit -m "Add JSON results from the pilot pipeline"
          git push

  summary:
    name: Summary
    needs: stage3
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download quality results
        uses: actions/download-artifact@v4
        with:
          name: pilot-results
          path: results

      - name: Summarize good and bad files
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/s4_summary.py results
